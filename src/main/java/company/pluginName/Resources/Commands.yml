        Permission: ""
        Usage: "<jugador>"
        Aliases: 
        - "k"
        Cooldown: 0
      List: 
        Name: "list"
        Description: "Abrir una lista con todas tus protecciones"
        Permission: ""
        Usage: "[jugador]"
        Aliases: 
        - "l"
        Cooldown: 0
      Remove-member: 
        Name: "removemember"
        Description: "Eliminar un miembro en tu protección actual"
