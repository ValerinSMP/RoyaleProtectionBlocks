Version: 2

Commands: 
  Protection-blocks: 
    Name: "protectionblocks"
    Description: "Abrir la interfaz o ejecutar comandos"
    Permission: ""
    Usage: "[help|subcomando]"
    Aliases: 
    - "pb"
    Subcommands: 
      Help: 
        Name: "help"
        Description: "Obtener todos los comandos"
        Permission: ""
        Usage: "[página]"
        Aliases: 
        - "h"
      Info: 
        Name: "info"
        Description: "Mostrar la información de una protección"
        Permission: ""
        Usage: "[members|owners|banneds]"
        Aliases: 
        - "i"
        Cooldown: 0
        Subcommands: 
          Help: 
            Name: "help"
            Description: "Obtener todos los comandos"
            Permission: ""
            Usage: "[página]"
            Aliases: 
            - "h"
          Members: 
            Name: "members"
            Description: "Obtener los miembros de la protección actual"
            Permission: ""
            Usage: "[página]"
            Aliases: 
            - "m"
          Owners: 
            Name: "owners"
            Description: "Obtener los dueños de la protección actual"
            Permission: ""
            Usage: "[página]"
            Aliases: 
            - "o"
          Banneds: 
            Name: "banneds"
            Description: "Obtener los baneados de la protección actual"
            Permission: ""
            Usage: "[página]"
            Aliases: 
            - "b"
      Blocks: 
        Name: "blocks"
        Description: "Abrir una lista con todos los bloques"
        Permission: "protectionblocks.blocks"
        Usage: "[help|subcomando]"
        Aliases: 
        - "b"
        Subcommands: 
          Help: 
            Name: "help"
            Description: "Obtener todos los comandos"
            Permission: ""
            Usage: "[página]"
            Aliases: 
            - "h"
          Remove: 
            Name: "remove"
            Description: "Eliminar un bloque existente"
            Permission: "protectionblocks.blocks.remove"
            Usage: "<id>"
            Aliases: 
            - "r"
            Cooldown: 0
          Add: 
            Name: "add"
            Description: "Crear un nuevo bloque"
            Permission: "protectionblocks.blocks.create"
            Usage: "<id> <x> <y> <z> [permiso]"
            Aliases: 
            - "a"
            Cooldown: 0
          Give: 
            Name: "give"
            Description: "Dar un bloque existente a ti mismo o a un jugador"
            Permission: "protectionblocks.blocks.give"
            Usage: "<id> [jugador]"
            Aliases: 
            - "g"
            Cooldown: 0
      Admin: 
        Name: "admin"
        Description: "Comandos utilizados para gestionar comandos de staff"
        Permission: "protectionblocks.admin"
        Usage: "[help|subcomando]"
        Aliases: 
        - "a"
        Subcommands: 
          Help: 
            Name: "help"
            Description: "Obtener todos los comandos"
            Permission: ""
            Usage: "[página]"
            Aliases: 
            - "h"
          Reload: 
            Name: "reload"
            Description: "Recargar el plugin"
            Permission: "protectionblocks.admin.reload"
            Aliases: 
            - "r"
            Cooldown: 0
          Spawn: 
            Name: "spawn"
            Description: "Usar este comando para verificar si el spawn ha sido configurado correctamente o no"
            Permission: "protectionblocks.admin.spawn"
            Aliases: 
            - "s"
            Cooldown: 0
          Set-spawn: 
            Name: "setspawn"
            Description: "Especificar el spawn configurado para el plugin. Este se usa principalmente para enviar jugadores después de ser expulsados o baneados de una protección"
            Permission: "protectionblocks.admin.setspawn"
            Aliases: 
            - "ss"
            Cooldown: 0
          Purge: 
            Name: "purge"
            Description: "Eliminar protecciones más antiguas que el tiempo especificado, basado en la última conexión del dueño o su fecha de creación"
            Permission: "protectionblocks.admin.purge"
            Usage: "[--days <cantidad de días>] [--hours <cantidad de horas>] [--minutes <cantidad de minutos>] [--config] [--show-ignored-players] [--export-only] [confirm]"
            Aliases: 
            - "p"
            Cooldown: 0
          Reset-flags: 
            Name: "resetflags"
            Description: "Restablecer los valores de las flags a los predeterminados"
            Permission: "protectionblocks.admin.resetflags"
            Aliases: 
            - "rf"
            Cooldown: 0
          Transfer: 
            Name: "transfer"
            Description: "Transferir datos de un plugin a RoyaleProtectionBlocks"
            Permission: "protectionblocks.admin.transfer"
            Usage: "[plugin a transferir] <confirm>"
            Aliases: 
            - "t"
            Cooldown: 0
          View: 
            Name: "view"
            Description: "Mostrar los límites de todas las protecciones durante un tiempo determinado"
            Permission: ""
            Aliases: 
            - "v"
            Cooldown: 0
          Unblock: 
            Name: "unblock"
            Description: "Permite desbloquear una protección"
            Permission: "protectionblocks.admin.unblock"
            Aliases: 
            - "ub"
            Cooldown: 0
          Flag: 
            Name: "flag"
            Description: "Reemplazar el valor de flag de una protección o todas las protecciones. No especificar valor para limpiar la flag de las protecciones."
            Permission: "protectionblocks.admin.flag"
            Aliases: 
            - "f"
            Cooldown: 0
          Block: 
            Name: "block"
            Description: "Permite bloquear una protección"
            Permission: "protectionblocks.admin.block"
            Aliases: 
            - "b"
            Cooldown: 0
          Staff-mode: 
            Name: "staffmode"
            Description: "Pone a ti mismo o a un jugador en modo staff, lo que permite omitir ciertas partes del sistema como el ban y protecciones bloqueadas"
            Permission: "protectionblocks.admin.staffmode"
            Aliases: 
            - "sm"
            Cooldown: 0
          Guard: 
            Name: "guard"
            Description: "Proteger jugadores del auto-purge o purges manuales para prevenir que sus protecciones sean eliminadas."
            Permission: "protectionblocks.admin.guard"
            Aliases: 
            - "g"
            Cooldown: 0
            Subcommands: 
              Protection: 
                Name: "protection"
                Description: "Gestionar el estado de guardia de la protección actual, estableciendo un nuevo tiempo de guardia."
                Permission: "protectionblocks.admin.guard.protection"
                Aliases: 
                - "pl"
                Cooldown: 0
              Player: 
                Name: "player"
                Description: "Gestionar el estado de guardia de un jugador, estableciendo un nuevo tiempo de guardia."
                Permission: "protectionblocks.admin.guard.player"
                Aliases: 
                - "pl"
                Cooldown: 0
      Leave: 
        Name: "leave"
        Description: "Salir de una protección, dejar de ser dueño o miembro"
        Permission: ""
        Aliases: 
        - "l"
        Cooldown: 0
      View: 
        Name: "view"
        Description: "Mostrar los límites de tu protección actual durante un tiempo determinado"
        Permission: ""
        Aliases: 
        - "v"
        Cooldown: 0
      Hide: 
        Name: "hide"
        Description: "Ocultar el bloque de protección en tu protección actual"
        Permission: ""
        Aliases: 
